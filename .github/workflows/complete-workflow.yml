name: Complete Workflow

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '*.md'
      - '.github/workflows/**'
      - 'docs/**'
      - 'docker/**'
  workflow_dispatch:

jobs:
  server-tests:
    name: Backend Tests (JUnit, Testcontainers, Rest Assured)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/pcmod

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pcmod
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Server Tests (JUnit, Testcontainers, Rest Assured)
        env:
          DB_URL: jdbc:mysql://localhost:3306/pcmod
          DB_USERNAME: root
          DB_PASSWORD: password
        run: ./mvnw verify '-Dtest=!es.codeurjcstudents.pcmod.e2e.ui.**'

      - name: Save JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/pcmod/target/site/jacoco/jacoco.xml

  client-tests:
    name: Frontend Unit and Integration Tests (Virtual DOM / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pcmod
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend and Client Unit and Integration Tests (Virtual DOM / Vitest)
        env:
          HEADLESS_TESTS: "true"
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          DB_URL: jdbc:mysql://localhost:3306/pcmod
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          cd ../backend/pcmod
          sudo -E ./mvnw spring-boot:run > /dev/null 2>&1 < /dev/null &
          
          npx wait-on https-get://localhost:443/api/v1/components/

          sudo chown -R $USER:$USER target/
          
          cd ../../frontend
          npm run test:coverage

      - name: Save LCOV Report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: frontend/coverage/lcov.info

  client-server-tests:
    name: E2E Client-Server Tests (Chrome + Selenium)
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pcmod
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Set up Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: E2E Client-Server Tests (Selenium)
        env:
          HEADLESS_TESTS: "true"
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          DB_URL: jdbc:mysql://localhost:3306/pcmod
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          cd frontend
          npm run dev > /dev/null 2>&1 < /dev/null &
          
          cd ../backend/pcmod
          sudo -E ./mvnw spring-boot:run > /dev/null 2>&1 < /dev/null &
          
          npx wait-on http-get://localhost:5173 https-get://localhost:443/api/v1/components/
          
          sudo chown -R $USER:$USER target/

          ./mvnw test -Dgroups="client-system"
      
  # SonarCloud Analysis
  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [client-server-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JaCoCo Report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: backend/pcmod/target/site/jacoco

      - name: Download LCOV Report
        uses: actions/download-artifact@v4
        with:
          name: lcov-report
          path: frontend/coverage

      - name: SonarCloud Analysis
        uses: sonarsource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}