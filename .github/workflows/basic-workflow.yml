name: Basic Workflow + SonarCloud Analysis

on:
  push:
    branches:
      - 'feature/*'
      - 'fix/*'
    paths-ignore:
      - '*.md'
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Frontend steps

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install client dependencies
        working-directory: frontend
        run: npm ci

      - name: Build client
        working-directory: frontend
        run: npm run build

      - name: Run Client Unit Tests with Coverage
        working-directory: frontend
        run: npm run test:unit-coverage

      # Backend steps

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Compile Backend & Run Unit Tests with JaCoCo
        working-directory: backend/pcmod
        run: ./mvnw clean test jacoco:report -Dgroups="server-unit"

      # SonarCloud Analysis
      - name: SonarCloud Analysis
        uses: sonarsource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}